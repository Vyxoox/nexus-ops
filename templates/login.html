<!DOCTYPE html>
{% import 'macros.html' as ui with context %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Corporativo — Nexus People &amp; Ops</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form-errors.css') }}">
</head>
<body>
{{ ui.app_header('Portal Corporativo de Acesso') }}

<div class="main">
    <div class="login-box">
        <h2>Entrar na Plataforma</h2>
        <p class="login-subtitle">Autenticação segura com trilha de auditoria e controle RBAC</p>
        {{ ui.flash_messages(compact=True) }}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="login" placeholder="Usuário" required autofocus>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar no Painel</button>
        </form>
    </div>
</div>

{{ ui.app_footer() }}
<script src="{{ url_for('static', filename='js/flash.js') }}"></script>
</body>
</html>
